# Dependabot will run on day 18 of each month at 01:48 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "cron"
      timezone: "Europe/Berlin"
      cronjob: "48 1 18 * *"
    open-pull-requests-limit: 15
    assignees:
      - "AlCalzone"
    versioning-strategy: "increase"
